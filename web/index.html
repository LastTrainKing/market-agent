<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>market-agent · 离线复盘工作台</title>
<style>
  :root{
    --bg:#0d1014; --panel:#161b22; --panel2:#1b2129; --line:#252d38;
    --tx:#e6e9ee; --tx2:#a8b3c0; --tx3:#78848f;
    --acc:#4da3ff; --ok:#3fb950; --warn:#d9a01c; --err:#e5534b; --pur:#a371f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);font:14px/1.7 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}

  header{border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0;background:var(--panel)}
  header h1{font-size:15px;font-weight:650;letter-spacing:-.01em}
  .pill{font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:600;border:1px solid}
  .pill.off{color:var(--warn);border-color:rgba(217,160,28,.35);background:rgba(217,160,28,.1)}
  .pill.on{color:var(--ok);border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.1)}
  .pill.mode{color:var(--acc);border-color:rgba(77,163,255,.35);background:rgba(77,163,255,.1)}
  header .sp{flex:1}
  header .meta{font-size:12px;color:var(--tx3)}

  main{flex:1;display:grid;grid-template-columns:240px 1fr 300px;min-height:0}

  aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  aside.right{border-right:none;border-left:1px solid var(--line);overflow:hidden}
  aside.right .sec{overflow-wrap:anywhere}
  .sec{padding:12px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
  .sec h2{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-bottom:8px}

  .agent{padding:9px 11px;border-radius:7px;cursor:pointer;margin-bottom:5px;border:1px solid transparent;transition:.12s}
  .agent:hover{background:var(--panel2)}
  .agent.sel{background:rgba(77,163,255,.1);border-color:rgba(77,163,255,.3)}
  .agent .n{font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
  .agent .n span{font-size:11px;color:var(--tx3);font-weight:500}
  .agent .d{font-size:11.5px;color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--tx2);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12.5px;font-family:inherit;transition:.12s}
  .btn:hover{border-color:var(--acc);color:var(--tx)}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#06121f;font-weight:650}
  .btn.pri:hover{background:#63b0ff}
  .btn.sm{padding:4px 9px;font-size:11.5px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .chat{display:flex;flex-direction:column;min-height:0;flex:1}
  .log{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
  .msg{border-radius:9px;padding:12px 15px;border:1px solid var(--line);background:var(--panel);max-width:100%}
  .msg.user{background:rgba(77,163,255,.08);border-color:rgba(77,163,255,.25);align-self:flex-end;max-width:75%}
  .msg .who{font-size:11px;color:var(--tx3);margin-bottom:5px;font-weight:600;letter-spacing:.03em}
  .msg .body{white-space:pre-wrap;word-break:break-word;font-size:13.5px}
  .msg .body.md{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12.8px;line-height:1.75}

  .step{display:flex;gap:9px;font-size:12.5px;padding:4px 0;color:var(--tx2)}
  .step .i{color:var(--tx3);width:16px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
  .step .t{color:var(--acc);font-weight:600}
  .step.bad .t{color:var(--err)}
  .step .a{color:var(--tx3);font-size:11.5px;font-family:ui-monospace,monospace}

  .composer{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;flex-shrink:0;background:var(--panel)}
  .composer textarea{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--tx);padding:9px 12px;font:inherit;font-size:13.5px;resize:none;height:44px;outline:none}
  .composer textarea:focus{border-color:var(--acc)}

  .panelrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
  .panelrow:last-child{border-bottom:none}
  .panelrow .tag{font-family:ui-monospace,monospace;color:var(--tx);font-size:12px}
  .panelrow .m{color:var(--tx3);font-size:11.5px}
  .empty{color:var(--tx3);font-size:12.5px;padding:8px 0}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.on{display:flex}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:11px;width:min(640px,92vw);max-height:86vh;overflow:auto;padding:22px}
  .box h3{font-size:16px;margin-bottom:14px}
  .f{margin-bottom:12px}
  .f label{display:block;font-size:12px;color:var(--tx3);margin-bottom:5px;font-weight:600}
  .f input,.f textarea,.f select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--tx);padding:8px 11px;font:inherit;font-size:13px;outline:none}
  .f input:focus,.f textarea:focus,.f select:focus{border-color:var(--acc)}
  .f textarea{resize:vertical;min-height:90px;line-height:1.65}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:9px}
  .tools label{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--tx2);cursor:pointer}
  .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .hint{font-size:11.5px;color:var(--tx3);margin-top:5px;line-height:1.6}
  .warnbox{background:rgba(217,160,28,.08);border:1px solid rgba(217,160,28,.3);border-radius:7px;padding:10px 13px;font-size:12px;color:var(--tx2);margin-bottom:14px;line-height:1.65}
</style>
</head>
<body>

<header>
  <h1>market-agent</h1>
  <span class="pill mode" id="mode">—</span>
  <span class="pill off" id="prov">—</span>
  <span class="sp"></span>
  <span class="meta" id="ws"></span>
</header>

<main>
  <aside>
    <div class="sec">
      <h2>Agent</h2>
      <div id="agents"></div>
      <button class="btn sm" style="width:100%;margin-top:8px" onclick="openEditor(null)">+ 新建 Agent</button>
    </div>
    <div class="sec" style="flex:1;overflow:auto">
      <h2>数据面板</h2>
      <div id="panels"></div>
      <div style="margin-top:10px">
        <input type="file" id="file" accept=".csv" style="display:none" onchange="doImport(this)">
        <button class="btn sm" style="width:100%" onclick="document.getElementById('file').click()">导入 CSV</button>
      </div>
      <div class="hint">需要「时间 / 代码 / 数值」三列。导入后可在左侧看到。</div>
    </div>
  </aside>

  <section class="chat">
    <div class="log" id="log">
      <div class="msg">
        <div class="who">说明</div>
        <div class="body">选一个 Agent，输入目标，回车运行。<br>
        默认离线模式：不联网、不需要 Key，用确定性规则跑通链路。<br>
        <b>本产品不抓行情</b>——数据只能从左侧导入。</div>
      </div>
    </div>
    <div class="composer">
      <textarea id="goal" placeholder="例如：复盘最新一天" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();doRun()}"></textarea>
      <button class="btn pri" id="runbtn" onclick="doRun()">运行</button>
    </div>
  </section>

  <aside class="right">
    <div class="sec">
      <h2>当前 Agent</h2>
      <div id="cur" class="empty">未选择</div>
    </div>
    <div class="sec" style="flex:1;overflow:auto">
      <h2>审计</h2>
      <div id="audit" class="empty">运行后显示</div>
    </div>
  </aside>
</main>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="mtitle">新建 Agent</h3>
    <div class="warnbox">
      <b>权限边界</b>：Agent 不能联网抓行情。工具集只读本地数据。
      这里的「等级」控制读写：<code>read</code> 只能读，<code>write</code> 可写报告。
    </div>
    <div class="f"><label>ID（英文，唯一）</label><input id="f_id" placeholder="my_agent"></div>
    <div class="f"><label>名称</label><input id="f_name" placeholder="我的复盘助手"></div>
    <div class="f"><label>人格 / 系统提示</label><textarea id="f_persona" placeholder="你是一位只做复盘、不做预测的分析师……"></textarea></div>
    <div class="f"><label>权限等级</label>
      <select id="f_level"><option value="read">read（只读）</option><option value="write">write（可写报告）</option></select>
    </div>
    <div class="f"><label>工具白名单（不勾 = 全部允许）</label><div class="tools" id="f_tools"></div></div>
    <div class="f"><label>最大步数</label><input id="f_steps" type="number" value="12" min="1" max="40"></div>
    <div class="row">
      <button class="btn" onclick="closeEditor()">取消</button>
      <button class="btn pri" onclick="saveAgent()">保存</button>
    </div>
  </div>
</div>

<script>
let STATE = {agents: [], tools: [], panels: [], provider: {}, shell_mode: ""};
let CUR = null;
let EDIT_ID = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, opt) {
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ok:false, error:"响应不是 JSON"}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

async function loadState() {
  STATE = await api("/api/state");
  $("mode").textContent = STATE.shell_mode === "pure" ? "纯空壳" : "离线复盘终端";
  const p = STATE.provider;
  $("prov").textContent = p.online ? ("模型：" + p.name + (p.key_set ? "" : "（缺 Key）")) : "离线模式";
  $("prov").className = "pill " + (p.online && p.key_set ? "on" : "off");
  $("ws").textContent = STATE.workspace;
  renderAgents(); renderPanels(); renderTools();
  if (!CUR && STATE.agents.length) selectAgent(STATE.agents[0].id);
}

function renderAgents() {
  $("agents").innerHTML = STATE.agents.map(a => `
    <div class="agent ${a.id===CUR?'sel':''}" onclick="selectAgent('${esc(a.id)}')">
      <div class="n">${esc(a.name)}<span>${a.builtin?'内置':'自定义'}</span></div>
      <div class="d">${esc(a.level)} · ${a.max_steps} 步</div>
    </div>`).join("");
}

function renderPanels() {
  const el = $("panels");
  if (!STATE.panels.length) { el.innerHTML = '<div class="empty">暂无数据，请先导入 CSV</div>'; return; }
  el.innerHTML = STATE.panels.map(p => `
    <div class="panelrow">
      <div><div class="tag">${esc(p.data_date || p.tag)}</div>
      <div class="m">${p.minutes} 分钟 × ${p.sectors} 板块 · ${esc(p.source)}</div></div>
    </div>`).join("");
}

function renderTools() {
  $("f_tools").innerHTML = STATE.tools.map(t => `
    <label><input type="checkbox" value="${esc(t.name)}"> ${esc(t.name)}</label>`).join("");
}

function selectAgent(id) {
  CUR = id;
  renderAgents();
  const a = STATE.agents.find(x => x.id === id);
  if (!a) { $("cur").textContent = "未选择"; return; }
  $("cur").innerHTML = `
    <div style="font-weight:600;margin-bottom:6px">${esc(a.name)}</div>
    <div style="font-size:12px;color:var(--tx3);line-height:1.7">
      等级 ${esc(a.level)} · 最多 ${a.max_steps} 步<br>
      工具 ${a.tools.length ? a.tools.length + " 个" : "全部"}<br>
      Provider ${esc(a.provider)}
    </div>
    <div style="font-size:12px;color:var(--tx2);margin-top:9px;line-height:1.7;max-height:120px;overflow:auto;word-break:break-word;padding-right:4px">${esc(a.persona)}</div>
    <div style="margin-top:11px;display:flex;gap:7px">
      ${a.builtin ? '' : `<button class="btn sm" onclick="openEditor('${esc(a.id)}')">编辑</button>
      <button class="btn sm" onclick="delAgent('${esc(a.id)}')">删除</button>`}
    </div>`;
  loadAudit(id);
}

async function loadAudit(id) {
  try {
    const recs = await api("/api/audit/" + encodeURIComponent(id));
    if (!recs.length) { $("audit").innerHTML = '<div class="empty">该 Agent 还没有运行记录</div>'; return; }
    $("audit").innerHTML = recs.slice(-14).map(r => {
      if (r.kind === "tool_call") return `<div class="step"><span class="i"></span><span><span class="t">${esc(r.tool)}</span> <span class="a">${r.ok?'ok':'fail'} ${r.duration_ms}ms</span></span></div>`;
      if (r.kind === "denied") return `<div class="step bad"><span class="i"></span><span>拒绝：${esc(r.reason)}</span></div>`;
      if (r.kind === "run_end") return `<div class="step"><span class="i"></span><span>结束：${esc(r.status)}</span></div>`;
      return "";
    }).join("");
  } catch (e) { $("audit").innerHTML = '<div class="empty">读取审计失败</div>'; }
}

function addMsg(who, body, cls, md) {
  const d = document.createElement("div");
  d.className = "msg " + (cls || "");
  d.innerHTML = `<div class="who">${esc(who)}</div><div class="body ${md?'md':''}">${md?esc(body):esc(body)}</div>`;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

async function doRun() {
  const goal = $("goal").value.trim();
  if (!goal) return;
  if (!CUR) { alert("先选一个 Agent"); return; }
  const a = STATE.agents.find(x => x.id === CUR);
  $("runbtn").disabled = true; $("runbtn").textContent = "运行中…";
  addMsg("你", goal, "user");
  $("goal").value = "";
  const holder = addMsg(a.name, "…");
  const t0 = Date.now();
  try {
    const r = await api("/api/run", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({agent_id: CUR, goal})
    });
    const trace = (r.trace || []).map(s =>
      s.kind === "final"
        ? `<div class="step"><span class="i">${s.step}</span><span>${esc(s.thought)}</span></div>`
        : `<div class="step"><span class="i">${s.step}</span><span><span class="t">${esc(s.tool)}</span> <span class="a">${esc(JSON.stringify(s.args))}</span></span></div>`
    ).join("");
    const bad = (r.denied || []).length
      ? `<div style="margin-top:8px;color:var(--err);font-size:12px">拒绝 ${r.denied.length} 次：${esc(r.denied.join("；"))}</div>` : "";
    holder.innerHTML = `<div class="who">${esc(a.name)} · ${r.ok?'完成':'未完成'} · ${((Date.now()-t0)/1000).toFixed(1)}s</div>
      <div style="margin-bottom:9px">${trace}</div>
      <div class="body md">${esc(r.answer || "（空）")}</div>${bad}`;
  } catch (e) {
    holder.innerHTML = `<div class="who">${esc(a.name)} · 失败</div><div class="body" style="color:var(--err)">${esc(e.message)}</div>`;
  } finally {
    $("runbtn").disabled = false; $("runbtn").textContent = "运行";
    $("log").scrollTop = $("log").scrollHeight;
    loadAudit(CUR);
  }
}

function openEditor(id) {
  EDIT_ID = id;
  const a = id ? STATE.agents.find(x => x.id === id) : null;
  $("mtitle").textContent = a ? "编辑 Agent" : "新建 Agent";
  $("f_id").value = a ? a.id : "";
  $("f_id").disabled = !!a;
  $("f_name").value = a ? a.name : "";
  $("f_persona").value = a ? a.persona : "";
  $("f_level").value = a ? a.level : "read";
  $("f_steps").value = a ? a.max_steps : 12;
  const sel = new Set(a ? a.tools : []);
  document.querySelectorAll("#f_tools input").forEach(cb => { cb.checked = sel.has(cb.value); });
  $("modal").classList.add("on");
}
function closeEditor(){ $("modal").classList.remove("on"); }

async function saveAgent() {
  const id = $("f_id").value.trim();
  if (!id) { alert("ID 不能为空"); return; }
  const tools = [...document.querySelectorAll("#f_tools input:checked")].map(c => c.value);
  try {
    await api("/api/agents", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        id, name: $("f_name").value.trim() || id,
        persona: $("f_persona").value.trim(),
        level: $("f_level").value, tools,
        max_steps: parseInt($("f_steps").value || "12", 10)
      })
    });
    closeEditor();
    await loadState();
    selectAgent(id);
  } catch (e) { alert("保存失败：" + e.message); }
}

async function delAgent(id) {
  if (!confirm("删除 Agent「" + id + "」？")) return;
  await api("/api/agents/" + encodeURIComponent(id), {method: "DELETE"});
  if (CUR === id) CUR = null;
  await loadState();
}

async function doImport(input) {
  const f = input.files[0];
  if (!f) return;
  const text = await f.text();
  const m = f.name.match(/(20\d{6})/);
  const tag = m ? m[1] : new Date().toISOString().slice(0,10).replace(/-/g,"");
  try {
    const r = await api("/api/import", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({filename: f.name, content: text, tag})
    });
    addMsg("系统", `已导入 ${r.tag}：${r.minutes} 分钟 × ${r.sectors} 板块`, null, true);
    await loadState();
  } catch (e) { alert("导入失败：" + e.message); }
  input.value = "";
}

loadState().catch(e => addMsg("系统", "加载失败：" + e.message));
</script>
</body>
</html>
